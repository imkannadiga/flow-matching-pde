_target_: data.swe.SWEDataModule

name: swe

data_path: ./data/_data/shallow-water/2D_rdb_NA_NA.h5

# Append the physical PDE time (grid/t[t_idx]) as a broadcast spatial channel.
# This is NOT flow-matching τ — it tells the model its position in the physical
# trajectory (e.g. 0.0–1.0 after normalisation).
append_physical_time: true

# Normalise grid/t to [0, 1] before broadcasting.
normalize_time: true

# Append x- and y-coordinate maps as extra conditioning channels.
append_coords: false

# Load all trajectories into RAM at init time.
# Set true for smaller datasets; false for large ones (lazy HDF5 reads).
preload: false

batch_size: 8
num_workers: 4
val_fraction: 0.3
split_seed: 42

# Dataset eval mode: when true, __getitem__ returns full trajectories for
# auto-regressive rollout instead of individual (x, y) training pairs.
# Set automatically by evaluate.py when time_variate=true — no need to set manually.
eval: false

# Signals to the evaluator that this is a time-variant PDE requiring rollout evaluation.
# When true, evaluate.py activates eval mode and FlowMatchingEvaluator uses
# _evaluate_rollout instead of the standard one-step path.
time_variate: true

# Per-trajectory z-score normalization of water-height values.
# Each sample is normalized by its own mean and std computed over all T×H×W values,
# so no global dataset scan is needed.  This aligns each trajectory with the N(0,1)
# flow-matching noise and eliminates the grid artifact at rollout step 0.
normalize_data: true
