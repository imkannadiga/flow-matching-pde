_target_: training.trainer.Trainer

model: ${model}
n_epochs: 200  # 100 was borderline for FM on 128x128; double for convergence
wandb_log: ${wandb.use_wandb}
device: "cuda"
mixed_precision: False
# Effective update batch ≈ batch_size × this (same loss reduction as one large batch with sum loss).
gradient_accumulation_steps: 1
eval_interval: 10
log_output: True
use_distributed: False
verbose: True

save_every: 20
save_path: ${hydra:run.dir}/checkpoints

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 3e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.n_epochs}

pre_train_processor:
  _target_: training.data_processors.FlowMatchingProcessor
  device: ${trainer.device}
  append_coords: false
  film_params: false
  coord_normalize: neg1_1

loss:
  # Relative L2 (per-sample normalized) is much better than MSE-sum for flow
  # matching: the velocity target v = x1 - x_noise has large high-freq energy
  # from x_noise; relative L2 suppresses those noisy gradient components.
  _target_: training.trainer.LpLoss
  d: 2
  p: 2
  reduction: true
  size_average: true

