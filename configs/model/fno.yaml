_target_: models.fno.FNO

name: fno
modes: 16          # 32 was too high for 128x128 grids — caused grid/Gibbs artifacts
hidden_channels: 128  # compensate expressivity lost from fewer modes
proj_channels: 128
x_dim: 2

n_layers: 4
separable: true

# Set to false when the dataset's conditioning tensor already contains x/y
# coordinate channels (e.g. spatial_conditioning: true in Darcy Mode B, or
# append_coords: true in SWE).  Prevents duplicating position information
# that is already present in the cond spatial pathway.
use_posn_embed: true