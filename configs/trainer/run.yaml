_target_: training.trainer.Trainer

model: ${model}
n_epochs: 200  # 100 was borderline for FM on 128x128; double for convergence
wandb_log: ${wandb.use_wandb}
device: "cuda"
mixed_precision: False
# Effective update batch ≈ batch_size × this (same loss reduction as one large batch with sum loss).
gradient_accumulation_steps: 1
eval_interval: 10
log_output: True
use_distributed: False
verbose: True

save_every: 20
save_path: ${hydra:run.dir}/checkpoints

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 3e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  # T_max = n_epochs // 3 gives exactly 1.5 half-periods over training:
  #   epoch 0          → η_max  (start)
  #   epoch T_max      → η_min  (first dip)
  #   epoch 2×T_max    → η_max  (rise)
  #   epoch 3×T_max    → η_min  (final dip — training ends here)
  # If you change n_epochs, update T_max = new_n_epochs // 3.
  T_max: 66       # = 200 // 3
  eta_min: 1.0e-6  # floor so LR never reaches zero (bad for Adam)

pre_train_processor:
  _target_: training.data_processors.FlowMatchingProcessor
  device: ${trainer.device}
  append_coords: false
  film_params: false
  coord_normalize: neg1_1

loss:
  _target_: torch.nn.MSELoss
  reduction: sum

# Solver used by RolloutTest during training-time rollout evaluation.
# Only active when data.rollout_val=true and data.time_variate=true.
# Use fewer steps than evaluate.py (100) to keep training-time cost manageable.
rollout_eval:
  solver:
    _target_: evaluation.solvers.EulerSolver
    n_steps: 100

