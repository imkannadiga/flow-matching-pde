defaults:
  - _self_
  - data: darcy
  - model: unet
  - trainer: debug
  - accelerate: single_gpu
  - wandb: disabled

hydra:
  run:
    dir: runs/${data.name}-${model.name}-${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: runs/multirun-${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${data.name}-${model.name}-${hydra.job.num}
